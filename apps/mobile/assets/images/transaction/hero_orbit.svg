<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120" fill="none">
  <defs>
    <radialGradient id="disc" cx="150" cy="60" r="140" gradientTransform="matrix(1 0 0 0.26 0 44.4)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EA1E63" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#EA1E63" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#EA1E63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="26" x2="0" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EA1E63" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FF5C93" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Lit floor under the coin -->
  <ellipse cx="150" cy="60" rx="140" ry="36" fill="url(#disc)"/>
  <!-- The orbit: bright at the front, faint at the back -->
  <ellipse cx="150" cy="60" rx="138" ry="33" stroke="url(#ring)" stroke-width="6" stroke-opacity="0.18"/>
  <ellipse cx="150" cy="60" rx="138" ry="33" stroke="url(#ring)" stroke-width="1.4"/>
  <ellipse cx="150" cy="62" rx="104" ry="22" stroke="#FF5C93" stroke-opacity="0.18" stroke-width="1"/>
</svg>
