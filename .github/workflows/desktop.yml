name: Desktop wallet
on:
  pull_request:
    paths: ["apps/desktop/**", "apps/frontend/**", "crates/mooze-core/**", "crates/mooze-app/**", "package*.json", "packages/design-tokens/**", "tools/design-tokens/**", "apps/mobile/lib/themes/**", ".gitattributes", ".github/workflows/desktop.yml"]
  push:
    branches: [main, develop]
    paths: ["apps/desktop/**", "apps/frontend/**", "crates/mooze-core/**", "crates/mooze-app/**", "package*.json", "packages/design-tokens/**", "tools/design-tokens/**", "apps/mobile/lib/themes/**", ".gitattributes", ".github/workflows/desktop.yml"]
permissions:
  contents: read
jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run tokens:test
      - run: npm run tokens:check
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run frontend:build
      # Native adapter/result tests use fake authentication; CI never opens Hello.
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features codegen
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        features: [codegen, "codegen,testnet"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run frontend:test
      - run: npm run frontend:build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features ${{ matrix.features }}
      - run: cargo test --locked --manifest-path crates/mooze-app/Cargo.toml --features codegen,electrum,http-reqwest
      - run: cargo check --locked --manifest-path packages/mooze_core_bridge/rust/Cargo.toml
